version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=nim
      - LLM_MODEL=qwen2.5-coder
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - DATAHUB_PROVIDER=fixtures
      - DATAHUB_FIXTURE=sales_dashboard
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      - GITHUB_BASE_BRANCH=main
      - GITHUB_DRAFT_PR=true
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # No persistent volumes needed for stateless demo

networks:
  default:
    name: serein-network